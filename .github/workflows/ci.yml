name: MeetingMind CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci || npm install

      - name: Typecheck Client
        run: |
          cd client
          npm run typecheck || npx tsc --noEmit

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci || npm install

      - name: Generate Prisma Client
        run: |
          cd server
          npx prisma generate

      - name: Build Server
        run: |
          cd server
          npm run build

  build-docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Client Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: false
          tags: meetingmind-client:test

      - name: Build Server Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: meetingmind-server:test
